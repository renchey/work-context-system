<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Context Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }
        .dashboard { max-width: 1400px; margin: 0 auto; }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #2a2a2a;
        }
        .header h1 { 
            font-size: 28px; 
            font-weight: 600;
            color: #4CAF50;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #1a1a1a;
            border-radius: 20px;
            font-size: 14px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        .status-dot.inactive { background: #f44336; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-bottom: 20px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2a2a2a;
        }
        .card h2 { 
            font-size: 16px; 
            color: #999;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-value { 
            font-size: 32px; 
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .card-label { 
            font-size: 14px; 
            color: #666;
        }
        .current-context {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #1a3a1a 0%, #1a1a1a 100%);
            border: 1px solid #2d4d2d;
        }
        .context-detail {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .context-detail:last-child { border-bottom: none; }
        .context-label { color: #999; font-size: 14px; }
        .context-value { 
            color: #fff; 
            font-weight: 600;
            font-size: 18px;
        }
        .timeline {
            grid-column: 1 / -1;
            max-height: 400px;
            overflow-y: auto;
        }
        .timeline-item {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: #141414;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 3px solid #4CAF50;
        }
        .timeline-item.afk { border-left-color: #ff9800; }
        .timeline-item.note { border-left-color: #2196F3; }
        .timeline-time {
            color: #666;
            font-size: 12px;
            min-width: 80px;
            font-family: 'Courier New', monospace;
        }
        .timeline-content { flex: 1; }
        .timeline-project {
            color: #4CAF50;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .timeline-worktype {
            color: #999;
            font-size: 14px;
        }
        .projects-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .project-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #141414;
            margin-bottom: 8px;
            border-radius: 6px;
        }
        .project-name { font-weight: 600; }
        .project-count {
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            background: #3a1a1a;
            color: #ff6b6b;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #4d2a2a;
        }
        .refresh-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .refresh-btn:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE = 'http://localhost:3042/api';

        function Dashboard() {
            const [status, setStatus] = useState(null);
            const [timeline, setTimeline] = useState([]);
            const [analytics, setAnalytics] = useState(null);
            const [projects, setProjects] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [lastUpdate, setLastUpdate] = useState(new Date());

            const fetchData = async () => {
                try {
                    setError(null);
                    const [statusRes, timelineRes, analyticsRes, projectsRes] = await Promise.all([
                        fetch(`${API_BASE}/status`),
                        fetch(`${API_BASE}/timeline/today?limit=20`),
                        fetch(`${API_BASE}/analytics`),
                        fetch(`${API_BASE}/projects`)
                    ]);

                    setStatus(await statusRes.json());
                    setTimeline((await timelineRes.json()).events || []);
                    setAnalytics(await analyticsRes.json());
                    setProjects((await projectsRes.json()).projects || []);
                    setLastUpdate(new Date());
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 10000);
                return () => clearInterval(interval);
            }, []);

            if (loading) return <div className="loading">Loading dashboard...</div>;

            return (
                <div className="dashboard">
                    <div className="header">
                        <h1>🎯 Work Context Dashboard</h1>
                        <div style={{display: 'flex', gap: '16px', alignItems: 'center'}}>
                            <div className="status-badge">
                                <div className={`status-dot ${status?.daemon?.running ? '' : 'inactive'}`}></div>
                                {status?.daemon?.running ? 'Tracking Active' : 'Daemon Stopped'}
                            </div>
                            <button className="refresh-btn" onClick={fetchData}>↻ Refresh</button>
                        </div>
                    </div>

                    {error && <div className="error">Error: {error}</div>}

                    <div className="grid">
                        <div className="card current-context">
                            <h2>Current Context</h2>
                            <div className="context-detail">
                                <span className="context-label">Project</span>
                                <span className="context-value">{status?.project || 'Unknown'}</span>
                            </div>
                            <div className="context-detail">
                                <span className="context-label">Work Type</span>
                                <span className="context-value">{status?.work_type || 'Unknown'}</span>
                            </div>
                            <div className="context-detail">
                                <span className="context-label">Confidence</span>
                                <span className="context-value">{status?.confidence || 'N/A'}</span>
                            </div>
                            <div className="context-detail">
                                <span className="context-label">System Load</span>
                                <span className="context-value">{status?.system_load || 'N/A'}</span>
                            </div>
                        </div>

                        <div className="card">
                            <h2>Total Events</h2>
                            <div className="card-value">{analytics?.total_events || 0}</div>
                            <div className="card-label">All captured events</div>
                        </div>

                        <div className="card">
                            <h2>Context Switches</h2>
                            <div className="card-value">{analytics?.context_switches || 0}</div>
                            <div className="card-label">Work context changes</div>
                        </div>

                        <div className="card">
                            <h2>AFK Periods</h2>
                            <div className="card-value">{analytics?.afk_periods || 0}</div>
                            <div className="card-label">Away from keyboard</div>
                        </div>

                        <div className="card">
                            <h2>Active Projects</h2>
                            <div className="card-value">{projects.length}</div>
                            <div className="card-label">Unique projects tracked</div>
                        </div>
                    </div>

                    <div className="grid">
                        <div className="card timeline">
                            <h2>Recent Timeline (Today)</h2>
                            {timeline.length === 0 ? (
                                <p style={{color: '#666', padding: '20px'}}>No events today yet</p>
                            ) : (
                                timeline.map((event, idx) => (
                                    <div key={idx} className={`timeline-item ${event.type}`}>
                                        <div className="timeline-time">
                                            {new Date(event.timestamp).toLocaleTimeString()}
                                        </div>
                                        <div className="timeline-content">
                                            {event.type === 'context_change' && (
                                                <>
                                                    <div className="timeline-project">
                                                        {event.data?.project || 'Unknown'}
                                                    </div>
                                                    <div className="timeline-worktype">
                                                        {event.data?.work_type || 'Unknown'} • Confidence: {event.data?.confidence || 'N/A'}
                                                    </div>
                                                </>
                                            )}
                                            {event.type === 'afk_detected' && (
                                                <div className="timeline-worktype">Away from keyboard</div>
                                            )}
                                            {event.type === 'work_note' && (
                                                <div className="timeline-worktype">📝 {event.data?.note}</div>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="card projects-list">
                            <h2>Top Projects</h2>
                            {analytics?.projects?.map((project, idx) => (
                                <div key={idx} className="project-item">
                                    <span className="project-name">{project.name}</span>
                                    <span className="project-count">{project.count} switches</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div style={{textAlign: 'center', color: '#666', fontSize: '12px', marginTop: '20px'}}>
                        Last updated: {lastUpdate.toLocaleTimeString()} • Auto-refresh every 10s
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
